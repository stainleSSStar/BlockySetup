# Konfiguracja Prometheus do scrapowania blocky (i node_exporter)
# Na DietPi skopiuj do: /mnt/dietpi_userdata/prometheus/prometheus.yml
# Na czystym Debianie/Ubuntu: /etc/prometheus/prometheus.yml
# Po zmianie: sudo systemctl restart prometheus

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # blocky — metryki DNS (http://127.0.0.1:4000/metrics)
  - job_name: blocky
    static_configs:
      - targets: ['127.0.0.1:4000']

  # opcjonalnie: metryki systemowe Raspberry Pi
  # (wymaga zainstalowanego Prometheus Node Exporter, port 9100)
  - job_name: node
    static_configs:
      - targets: ['127.0.0.1:9100']

  # Prometheus scrapuje też samego siebie
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']
